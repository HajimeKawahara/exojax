      gu: gu
      h: h
      k: k
      nl: nl
      nu: nu
      nu0: nu0
  - id: planetlib.radiation.lte.relation.planck_frequency
    equation:
      id: planetlib.radiation.lte.planck_frequency
      revision: '1'
    kind: equation
    role: Planck specific intensity per ordinary frequency and steradian.
    quantities:
      Bf: Bf
      T: T
      c: c
      frequency: frequency
      h: h
      k: k
