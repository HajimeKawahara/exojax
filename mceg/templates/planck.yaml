  statement: With the documented kernel constants and array conventions, piB and piBarr evaluate the four-relation
    Planck flux composition and its temperature and wavenumber derivatives.
  scope: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid is spectroscopic wavenumber
    in cm^-1. piB returns shape (Nnu,), piBarr returns (Nlayer,Nnu). Shared h is the effective kernel parameter
