  name: Spherical pure-absorption transmission
  description: Provider-owned conventions and bounded review scope for shared Planetlib
    definitions.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
