  coordinates: []
- id: planetlib.radiation.lte.quantity.gl
  revision: '1'
  latex: g_l
  description: Lower-level statistical weight.
  unit: '1'
  domain: Positive; same grouping as the shared line coefficients.
  coordinates: []
- id: planetlib.radiation.lte.quantity.gu
  revision: '1'
  latex: g_u
  description: Upper-level statistical weight.
  unit: '1'
  domain: Positive; same grouping as the shared line coefficients.
  coordinates: []
- id: planetlib.radiation.lte.quantity.h
  revision: '1'
  latex: h
  description: Planck constant for ordinary frequency.
  unit: erg s
  domain: Positive.
  coordinates: []
- id: planetlib.radiation.lte.quantity.k
  revision: '1'
  latex: k_{\rm B}
  description: Boltzmann constant.
  unit: erg K^-1
  domain: Positive.
  coordinates: []
- id: planetlib.radiation.lte.quantity.nl
  revision: '1'
  latex: n_l
  description: Lower-level number density summed over its statistical weight.
  unit: cm^-3
  domain: Positive for the population ratio.
  coordinates: []
- id: planetlib.radiation.lte.quantity.nu
  revision: '1'
  latex: n_u
  description: Upper-level number density summed over its statistical weight.
  unit: cm^-3
  domain: Positive under the adopted Boltzmann closure.
  coordinates: []
- id: planetlib.radiation.lte.quantity.nu0
  revision: '1'
  latex: \nu_0
  description: Transition frequency corresponding to the upper-minus-lower energy.
  unit: Hz
  domain: Positive; distinct from the spectral evaluation coordinate.
  coordinates: []
- id: planetlib.radiation.lte.quantity.Bk
  revision: '1'
  latex: B_{\widetilde\nu}
  description: Planck specific intensity per spectroscopic wavenumber.
  unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
  domain: The same spectral interval as Bf.
  coordinates: []
- id: planetlib.radiation.lte.quantity.chif
  revision: '1'
  latex: \chi_\nu
  description: Signed inverse-path extinction evaluated at ordinary frequency.
  unit: cm^-1
  domain: May be negative; it is not a spectral density.
  coordinates: []
- id: planetlib.radiation.lte.quantity.chik
  revision: '1'
  latex: \chi_{\widetilde\nu}
  description: The same signed inverse-path extinction evaluated at wavenumber.
  unit: cm^-1
  domain: No spectral-density Jacobian multiplies this quantity.
  coordinates: []
- id: planetlib.radiation.lte.quantity.jf
  revision: '1'
  latex: j_\nu
  description: Emission coefficient per steradian and ordinary frequency.
  unit: erg s^-1 cm^-3 sr^-1 Hz^-1
  domain: Pointwise value at the matched frequency.
  coordinates: []
- id: planetlib.radiation.lte.quantity.jk
  revision: '1'
  latex: j_{\widetilde\nu}
  description: Emission coefficient per steradian and wavenumber.
  unit: erg s^-1 cm^-3 sr^-1 (cm^-1)^-1
  domain: Pointwise value at the matched wavenumber.
  coordinates: []
- id: planetlib.radiation.lte.quantity.phif
  revision: '1'
  latex: \phi_\nu
  description: Line profile normalized by its integral over ordinary frequency.
  unit: Hz^-1
  domain: Nonnegative; the same profile as phik under coordinate change.
  coordinates: []
- id: planetlib.radiation.lte.quantity.phik
  revision: '1'
  latex: \phi_{\widetilde\nu}
  description: Line profile normalized by its integral over wavenumber.
  unit: (cm^-1)^-1
  domain: Nonnegative; the same physical profile as phif.
  coordinates: []
- id: planetlib.radiation.lte.quantity.piB
  revision: '1'
  latex: \pi B_{\widetilde\nu}
  description: Hemispheric blackbody flux per wavenumber, matching ExoJAX piB.
  unit: erg s^-1 cm^-2 (cm^-1)^-1
  domain: Isotropic intensity integrated over an outward hemisphere with cosine weight.
  coordinates: []
- id: planetlib.radiation.lte.quantity.wavenumber
  revision: '1'
  latex: \widetilde\nu
  description: Spectroscopic wavenumber, not angular wavenumber.
  unit: cm^-1
  domain: Positive; same photon as frequency.
  coordinates: []
