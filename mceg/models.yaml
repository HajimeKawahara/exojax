inventory_version: '0.1'
scope: All packaged files under src/exojax, including coefficient and test data. This initial inventory maps the
  main scientific families and selected variants; it is not an exhaustive review of every branch, callback or external
  dataset. Only inspected API/model-boundary files are classified. Other files remain visible as unreviewed, and
  uncontracted families retain explicit gaps. The six linked contracts cover scoped shared definitions, not complete
  provider equivalence or physical accuracy. Research examples, observation-specific priors/likelihoods and external
  downloads are outside the scan roots. File hashes identify an inspection snapshot, not an execution or scientific
  judgment.
source_roots:
- src/exojax
contract_roots:
- mceg/contracts
