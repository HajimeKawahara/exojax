- id: planetlib.spectroscopy.lte_lines.line_sum
  revision: '1'
  description: Additive cross section from a finite selected list of normalized transitions.
  scope: One isolated transition per absorber, ordinary spectroscopic wavenumber in
    cm^-1, LTE strength scaling and a normalized Voigt profile. The total line cross
    section is the sum of such contributions. The Lorentz width is supplied externally;
    pressure-broadening prescriptions, line truncation, line lists and partition-function
