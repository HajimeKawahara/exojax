    constants.hcgs=6.62607015e-27 is not used by this kernel and differs from the effective h by about 1.66e-8
    relative. No numerical constants are changed by this adoption. Positive finite interior inputs only; no
    complete float32/float64 stability bound, zero-frequency limit, population solver or atmospheric LTE assumption
    is established.
