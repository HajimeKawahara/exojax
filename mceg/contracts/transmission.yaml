    - src/exojax/rt/rtransfer.py:rtrun_trans_pureabs_simpson
    - src/exojax/rt/rtransfer.py:rtrun_trans_pureabs_trapezoid
    - src/exojax/rt/trans.py:ArtTransPure.run
assumptions:
- statement: 'Spherical static straight rays, opaque lower radius R0, transparent
    exterior above R_top, no scattering/refraction, and radial extinction alpha. Chord
    geometry uses piecewise constant layers ordered top to bottom. Raw integration
    returns squared radius in the radius units supplied; ArtTransPure normalizes lengths
    by its bottom radius and returns A=(R_tr/R_bottom)^2. A is not stellar transit
    depth: D=R_tr^2/R_star^2 requires a separately supplied stellar radius. Trapezoid
    and Simpson quadratures have different finite-grid errors.'
  evidence:
  - exojax.transmission.source
