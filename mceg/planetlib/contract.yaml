equations:
- id: planetlib.radiation.lte.boltzmann_ratio
  revision: '1'
  description: Boltzmann population ratio for a specified transition.
  scope: LTE closure and spectral-coordinate conventions under the stated assumptions.
  symbols:
    T:
      latex: T
      description: LTE material and Planck radiation temperature.
      unit: K
    gl:
      latex: g_l
      description: Lower-level statistical weight.
      unit: '1'
    gu:
      latex: g_u
      description: Upper-level statistical weight.
      unit: '1'
    h:
      latex: h
      description: Planck constant for ordinary frequency.
      unit: erg s
    k:
      latex: k_{\rm B}
      description: Boltzmann constant.
      unit: erg K^-1
    nl:
      latex: n_l
      description: Lower-level number density summed over its statistical weight.
      unit: cm^-3
    nu:
      latex: n_u
      description: Upper-level number density summed over its statistical weight.
      unit: cm^-3
    nu0:
      latex: \nu_0
      description: Transition frequency corresponding to the upper-minus-lower energy.
      unit: Hz
  assumptions:
  - Scalar unpolarized radiation in a static local rest frame. Both populations refer
    to one transition of energy h nu0, with positive T and matching statistical weights.
    Planck intensity is per steradian. Coordinate conversions evaluate the same physical
    frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse cm. Spectral
    densities and normalized profiles acquire the Jacobian c; signed extinction, an
    inverse path length, does not. The existing line-coefficient model uses line-center
    prefactors, so its LTE source function (for nonzero extinction) is B(nu0,T), not
    B(f,T) throughout an arbitrary broad line. No transport or population solver is
    selected.
  - All symbols denote numerical magnitudes in the declared units.
  evidence:
  - planetlib.radiation.lte.upstream
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Mul(Pow(Symbol('nl'), Integer(-1)), Symbol('nu')), Mul(Pow(Symbol('gl'),
      Integer(-1)), Symbol('gu'), exp(Mul(Integer(-1), Pow(Symbol('T'), Integer(-1)),
      Symbol('h'), Pow(Symbol('k'), Integer(-1)), Symbol('nu0')))))
