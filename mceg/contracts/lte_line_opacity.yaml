      unit: cm
    sigma_abs:
      latex: \sigma_{abs}
      description: Single-transition absorption cross section per absorber at offset
        x.
      unit: cm^2
    x:
      latex: x
      description: Wavenumber offset from the transition center.
      unit: cm^-1
  assumptions:
