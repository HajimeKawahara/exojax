      unit: cm^2
    w:
      latex: w
      description: Spectroscopic wavenumber at which the finite line list is evaluated.
      unit: cm^-1
    w_line:
      latex: w_{line}
      description: Line-center wavenumbers in the same selected list.
      unit: cm^-1
  assumptions:
  - T, T_ref, w0, Q_ratio, sigma_D, gamma_L and absorber mass are positive; the Gaussian
