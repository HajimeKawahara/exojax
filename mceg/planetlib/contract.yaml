  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/src/escape/hydrogen_continuum.py
  - https://github.com/HajimeKawahara/exojax/blob/19fe37b5509d931e6fb85bcd731be60877751544/src/exojax/rt/planck.py
  - https://github.com/HajimeKawahara/exojax/blob/19fe37b5509d931e6fb85bcd731be60877751544/src/exojax/database/core/line_strength.py
  scope: Scalar unpolarized radiation in a static local rest frame. Both populations
    refer to one transition of energy h nu0, with positive T and matching statistical
    weights. Planck intensity is per steradian. Coordinate conversions evaluate the
    same physical frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse
    cm. Spectral densities and normalized profiles acquire the Jacobian c; signed
    extinction, an inverse path length, does not. The existing line-coefficient model
    uses line-center prefactors, so its LTE source function (for nonzero extinction)
    is B(nu0,T), not B(f,T) throughout an arbitrary broad line. No transport or population
    solver is selected.
  result: null
  provenance:
    role: implementation
    location: The selected source files and MCEG equations at the pinned commits.
    inspection: inspected
    note: Sources were read locally; provider test status and empirical support remain
      upstream.
    derived_from: []
  subject: null
  context: null
  artifacts: []
limitations:
- statement: The catalog model closures also contain Boltzmann, profile, emission
    and extinction definitions. They are not relations of the local Planck flux model
    and no correspondence or support is claimed for them.
  evidence:
  - exojax.planetlib.selection
- statement: Location/result bindings do not encode an array axis or the internally
    composed Planck intensity. Sampled value and derivative checks supply finite numerical
    comparisons, not a proof or a new physical review.
  evidence:
  - exojax.planetlib.source
