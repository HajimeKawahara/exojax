- id: planetlib.radiation.lte.populations
  revision: '1'
  description: LTE closure and spectral-coordinate conventions
  scope: Scalar unpolarized radiation in a static local rest frame. Both populations
    refer to one transition of energy h nu0, with positive T and matching statistical
    weights. Planck intensity is per steradian. Coordinate conversions evaluate the
    same physical frequency f=c*wavenumber, with c in cm/s and wavenumber in inverse
    cm. Spectral densities and normalized profiles acquire the Jacobian c; signed
    extinction, an inverse path length, does not. The existing line-coefficient model
    uses line-center prefactors, so its LTE source function (for nonzero extinction)
    is B(nu0,T), not B(f,T) throughout an arbitrary broad line. No transport or population
    solver is selected.
  quantities:
    Bf:
      quantity:
        id: planetlib.radiation.lte.quantity.Bf
        revision: '1'
      role: derived
    T:
      quantity:
        id: planetlib.radiation.lte.quantity.T
        revision: '1'
      role: input
    c:
      quantity:
        id: planetlib.radiation.lte.quantity.c
        revision: '1'
      role: input
    frequency:
      quantity:
        id: planetlib.radiation.lte.quantity.frequency
        revision: '1'
      role: input
    gl:
      quantity:
        id: planetlib.radiation.lte.quantity.gl
        revision: '1'
      role: input
    gu:
      quantity:
        id: planetlib.radiation.lte.quantity.gu
        revision: '1'
      role: input
    h:
      quantity:
        id: planetlib.radiation.lte.quantity.h
        revision: '1'
      role: input
    k:
      quantity:
        id: planetlib.radiation.lte.quantity.k
        revision: '1'
      role: input
    nl:
      quantity:
        id: planetlib.radiation.lte.quantity.nl
        revision: '1'
      role: input
    nu:
      quantity:
        id: planetlib.radiation.lte.quantity.nu
        revision: '1'
      role: input
    nu0:
      quantity:
        id: planetlib.radiation.lte.quantity.nu0
        revision: '1'
      role: input
  relations:
