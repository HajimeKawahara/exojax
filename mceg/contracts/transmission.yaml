equations:
- id: planetlib.radiation.spherical_transmission.blocked_area
  revision: '1'
  description: Opaque-bottom disk plus atmospheric blocked area, divided by pi.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays,
    pure absorption, and an opaque bottom radius R0 beneath a finite top R_top. The
    apparent blocked radius, its normalization by R0, and transit depth normalized
    by a uniformly illuminated stellar disk are distinct quantities. Stellar limb
    darkening, refraction, multiple scattering and overlap geometry are external.
  symbols:
    R0:
      latex: R_{0}
      description: Opaque lower boundary radius.
      unit: cm
    R_top:
      latex: R_{top}
      description: Atmospheric top radius.
      unit: cm
    R_tr_sq:
      latex: R_{tr sq}
      description: Square of the effective opaque-disk transit radius.
      unit: cm^2
    b:
      latex: b
      description: Ray impact parameter relative to planet center.
      unit: cm
    tau_chord:
      latex: \tau_{chord}
      description: Total near-side plus far-side chord optical depth.
      unit: '1'
  assumptions:
  - R_star >= R_top > R0 > 0, with a central unocculted stellar background for the
    simple area ratio.
  - alpha is nonnegative and radial only; the chord integral applies for R0 <= b <
    R_top, with zero atmospheric opacity beyond R_top.
  - The opaque lower disk contributes pi*R0^2 even when the atmosphere is transparent.
    Numerical quadrature and cellwise geometric reconstruction are provider choices.
  evidence:
  - planetlib.radiation.spherical_transmission.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('R_tr_sq', real=True), Add(Pow(Symbol('R0', real=True),
      Integer(2)), Mul(Integer(2), Integral(Mul(Symbol('b', real=True), Add(Integer(1),
      Mul(Integer(-1), exp(Mul(Integer(-1), Function('tau_chord')(Symbol('b', real=True))))))),
      Tuple(Symbol('b', real=True), Symbol('R0', real=True), Symbol('R_top', real=True))))))
- id: planetlib.radiation.spherical_transmission.chord_depth
  revision: '1'
  description: Two-sided spherical chord optical depth.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays,
    pure absorption, and an opaque bottom radius R0 beneath a finite top R_top. The
    apparent blocked radius, its normalization by R0, and transit depth normalized
    by a uniformly illuminated stellar disk are distinct quantities. Stellar limb
    darkening, refraction, multiple scattering and overlap geometry are external.
  symbols:
    R_top:
      latex: R_{top}
      description: Atmospheric top radius.
      unit: cm
    alpha:
      latex: \alpha
      description: Radial absorption coefficient at the chosen spectral coordinate.
      unit: cm^-1
    b:
      latex: b
      description: Ray impact parameter relative to planet center.
      unit: cm
    r:
      latex: r
      description: Radius along the chord integral.
      unit: cm
    tau_chord:
      latex: \tau_{chord}
      description: Total near-side plus far-side chord optical depth.
      unit: '1'
  assumptions:
  - R_star >= R_top > R0 > 0, with a central unocculted stellar background for the
    simple area ratio.
  - alpha is nonnegative and radial only; the chord integral applies for R0 <= b <
    R_top, with zero atmospheric opacity beyond R_top.
  - The opaque lower disk contributes pi*R0^2 even when the atmosphere is transparent.
    Numerical quadrature and cellwise geometric reconstruction are provider choices.
  evidence:
  - planetlib.radiation.spherical_transmission.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('tau_chord')(Symbol('b', real=True)), Mul(Integer(2),
      Integral(Mul(Symbol('r', real=True), Pow(Add(Mul(Integer(-1), Pow(Symbol('b',
      real=True), Integer(2))), Pow(Symbol('r', real=True), Integer(2))), Rational(-1,
      2)), Function('alpha')(Symbol('r', real=True))), Tuple(Symbol('r', real=True),
      Symbol('b', real=True), Symbol('R_top', real=True)))))
- id: planetlib.radiation.spherical_transmission.normalized_radius
  revision: '1'
  description: Transit-radius normalization used independently of stellar size.
  scope: A spherical atmosphere at one spectral coordinate, straight parallel rays,
    pure absorption, and an opaque bottom radius R0 beneath a finite top R_top. The
    apparent blocked radius, its normalization by R0, and transit depth normalized
    by a uniformly illuminated stellar disk are distinct quantities. Stellar limb
    darkening, refraction, multiple scattering and overlap geometry are external.
  symbols:
    A:
      latex: A
      description: Transit radius squared divided by the opaque bottom radius squared.
      unit: '1'
    R0:
      latex: R_{0}
      description: Opaque lower boundary radius.
      unit: cm
    R_tr_sq:
      latex: R_{tr sq}
      description: Square of the effective opaque-disk transit radius.
      unit: cm^2
  assumptions:
  - R_star >= R_top > R0 > 0, with a central unocculted stellar background for the
