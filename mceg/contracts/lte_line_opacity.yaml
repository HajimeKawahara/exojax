  - The untruncated profile integrates over the whole real wavenumber offset. Absorber
    counting and isotopic abundance conventions belong to the supplied S_ref.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('sigma_total')(Symbol('w', real=True)), Sum(Mul(Function('S_line')(Symbol('i',
      real=True)), Function('phi_line')(Symbol('i', real=True), Add(Symbol('w', real=True),
      Mul(Integer(-1), Function('w_line')(Symbol('i', real=True)))))), Tuple(Symbol('i',
      real=True), Integer(1), Symbol('N_lines', real=True))))
- id: planetlib.spectroscopy.lte_lines.lorentz_profile
  revision: '1'
  description: Normalized Lorentz profile.
