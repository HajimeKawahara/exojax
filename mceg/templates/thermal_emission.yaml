assumptions:
- statement: Plane-parallel static pure absorption, positive mu toward the observer, top-to-bottom optical-depth
    layers, constant source per layer and an explicitly selected lower boundary. Shared I and S are physical
    spectral specific intensity per cm^-1 per steradian. ArtEmisPure supplies piB and propagates pi*I internally;
    flux reconstruction therefore uses 2*sum(mu*weight*internal_intensity), whereas physical I requires 2*pi.
    No scattering or population-equilibrium closure is supplied by this model. Finite angular quadrature and
    isothermal layer approximation are provider choices.
  evidence:
  - exojax.thermal_emission.source
