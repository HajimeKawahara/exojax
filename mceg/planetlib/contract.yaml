  revision: '1'
  description: Planck hemispheric flux per spectroscopic wavenumber from four shared
    Planetlib relations.
  scope: Positive temperature and wavenumber in a static local frame; blackbody intensity
    integrated over an isotropic hemisphere. ExoJAX piB and piBarr return flux per
    inverse centimetre, not specific intensity per Hz or per steradian. No population
    closure, line strength, line profile or extinction model is selected.
  quantities:
    Bf:
      quantity:
        id: planetlib.radiation.lte.quantity.Bf
        revision: '1'
      role: derived
    T:
