schema_version: '0.6'
model:
  id: exojax.spectral_observation
  name: Spectral convolution, rotation and Doppler sampling
  description: Provider-owned conventions and bounded review scope for shared Planetlib definitions.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
    entry_points:
    - src/exojax/postproc/response.py:ipgauss
    - src/exojax/postproc/response.py:sampling
    - src/exojax/postproc/spin_rotation.py:rotkernel
    - src/exojax/postproc/spin_rotation.py:convolve_rigid_rotation
assumptions:
- statement: Velocity coordinates, beta, vsini, RV and c use km/s. response.sampling evaluates the input at
    w_obs*(1+RV/c), a nonrelativistic convention with this explicit positive-RV sign. Continuous Gaussian and
    rigid-rotation kernels are normalized in the shared definitions; the provider samples a finite window and
    renormalizes its discrete sum. Rotation adopts quadratic limb darkening 1-u1*(1-mu)-u2*(1-mu)^2 and support
    |v|<=vsini. Convolution uses finite-array edge handling and interpolation follows the provider grid; these
    are not continuous-infinite-domain identities. Passing convolution samples use even-length spectra and
    odd-length kernels. For the shared convolution binding only, F0 and F_out denote dimensionless continuum-normalized
    spectra. The provider also accepts other flux units; that broader numerical use is outside the shared convolution
    quantity declaration.
  evidence:
  - exojax.spectral_observation.source
domains:
- kind: scientific_applicability
  status: unknown
  description: Application to a particular atmosphere or observation needs independent validation.
  conditions: []
  evidence:
  - exojax.spectral_observation.source
limitations:
- statement: No relativistic Doppler law, spatially varying line spread function, transmission-annulus rotation,
    detector bin integration, or boundary-independent flux conservation is asserted. The odd-length spectrum/odd-length
    kernel case currently loses one output sample because convolve_same does not supply the inverse FFT length;
    a strict expected-failure regression records this known numerical defect.
  evidence:
  - exojax.spectral_observation.source
