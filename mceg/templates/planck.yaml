schema_version: '0.6'
model:
  id: exojax.planetlib.adoption
  name: ExoJAX adoption of shared Planck and coordinate definitions
  description: A local four-relation model records the actual Planck kernel conventions; imported closure records
    make the contract standalone, without claiming that the full LTE models are implemented.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
    entry_points:
    - src/exojax/rt/planck.py:piB
    - src/exojax/rt/planck.py:piBarr
assumptions:
- statement: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid is spectroscopic wavenumber
    in cm^-1. piB returns shape (Nnu,), piBarr returns (Nlayer,Nnu). Shared h is the effective kernel parameter
    fac_planck/(2*pi*ccgs**2)=6.62607004e-27 erg*s; c=ccgs and k=h*c/hcperk=1.38064852e-16 erg/K. The exported
    constants.hcgs=6.62607015e-27 is not used by this kernel and differs from the effective h by about 1.66e-8
    relative. No numerical constants are changed by this adoption.
  evidence:
  - exojax.planetlib.source
domains:
- kind: scientific_applicability
  status: unknown
  description: No atmospheric LTE applicability or radiative-transfer model is assessed.
  conditions: []
  evidence:
  - exojax.planetlib.source
limitations:
- statement: The catalog model closures also contain Boltzmann, profile, emission and extinction definitions.
    They are not relations of the local Planck flux model and no correspondence or support is claimed for them.
  evidence:
  - exojax.planetlib.selection
- statement: Location/result bindings do not encode an array axis or the internally composed Planck intensity.
    Sampled value and derivative checks supply finite numerical comparisons, not a proof or a new physical
    review.
  evidence:
  - exojax.planetlib.source
subjects:
- id: exojax.planetlib.source
  implementation: *id001
  selected_files:
    src/exojax/rt/planck.py: 670a9d66a5bbbcfe2947f92bc55f529270dc802b3ecd73b3e0aba88d4f3fe3b1
