equations:
- id: planetlib.spectroscopy.lte_lines.doppler_width
  revision: '1'
  description: Thermal Doppler standard deviation.
  scope: One isolated transition per absorber, ordinary spectroscopic wavenumber in
    cm^-1, LTE strength scaling and a normalized Voigt profile. The total line cross
    section is the sum of such contributions. The Lorentz width is supplied externally;
    pressure-broadening prescriptions, line truncation, line lists and partition-function
    data are not chosen.
  symbols:
    T:
      latex: T
      description: Local kinetic and excitation temperature.
      unit: K
    c:
      latex: c
      description: Vacuum speed of light.
      unit: cm s^-1
    k_B:
      latex: k_{B}
      description: Boltzmann constant.
      unit: erg K^-1
    m_abs:
      latex: m_{abs}
      description: Mass of one absorbing particle in grams.
      unit: g
    sigma_D:
      latex: \sigma_{D}
      description: Gaussian Doppler standard deviation in wavenumber.
      unit: cm^-1
    w0:
      latex: w_{0}
      description: Transition center spectroscopic wavenumber.
      unit: cm^-1
  assumptions:
  - T, T_ref, w0, Q_ratio, sigma_D, gamma_L and absorber mass are positive; the Gaussian
    width is a standard deviation and the Lorentz width is a half width at half maximum.
  - Q_ratio means Q(T)/Q(T_ref), using the same absorber and partition-function convention
    as S_ref. E_lower is expressed as a wavenumber, not an energy in erg.
  - The untruncated profile integrates over the whole real wavenumber offset. Absorber
    counting and isotopic abundance conventions belong to the supplied S_ref.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('sigma_D', real=True), Mul(Pow(Symbol('c', real=True),
      Integer(-1)), Symbol('w0', real=True), Pow(Mul(Symbol('T', real=True), Symbol('k_B',
      real=True), Pow(Symbol('m_abs', real=True), Integer(-1))), Rational(1, 2))))
- id: planetlib.spectroscopy.lte_lines.gaussian_profile
  revision: '1'
  description: Normalized Gaussian profile.
  scope: One isolated transition per absorber, ordinary spectroscopic wavenumber in
    cm^-1, LTE strength scaling and a normalized Voigt profile. The total line cross
    section is the sum of such contributions. The Lorentz width is supplied externally;
    pressure-broadening prescriptions, line truncation, line lists and partition-function
    data are not chosen.
  symbols:
    G:
      latex: G
      description: Normalized Gaussian density per wavenumber offset.
      unit: cm
    sigma_D:
      latex: \sigma_{D}
      description: Gaussian Doppler standard deviation in wavenumber.
      unit: cm^-1
    x:
      latex: x
      description: Wavenumber offset from the transition center.
      unit: cm^-1
  assumptions:
  - T, T_ref, w0, Q_ratio, sigma_D, gamma_L and absorber mass are positive; the Gaussian
    width is a standard deviation and the Lorentz width is a half width at half maximum.
  - Q_ratio means Q(T)/Q(T_ref), using the same absorber and partition-function convention
    as S_ref. E_lower is expressed as a wavenumber, not an energy in erg.
  - The untruncated profile integrates over the whole real wavenumber offset. Absorber
    counting and isotopic abundance conventions belong to the supplied S_ref.
  evidence:
  - planetlib.spectroscopy.lte_lines.source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('G')(Symbol('x', real=True)), Mul(Rational(1, 2),
      Pow(Integer(2), Rational(1, 2)), Pow(pi, Rational(-1, 2)), Pow(Symbol('sigma_D',
      real=True), Integer(-1)), exp(Mul(Integer(-1), Rational(1, 2), Pow(Symbol('sigma_D',
      real=True), Integer(-2)), Pow(Symbol('x', real=True), Integer(2))))))
- id: planetlib.spectroscopy.lte_lines.line_cross_section
  revision: '1'
  description: Cross section of one normalized transition.
  scope: One isolated transition per absorber, ordinary spectroscopic wavenumber in
    cm^-1, LTE strength scaling and a normalized Voigt profile. The total line cross
    section is the sum of such contributions. The Lorentz width is supplied externally;
