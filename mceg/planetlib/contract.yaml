schema_version: '0.6'
model:
  id: exojax.planetlib.adoption
  name: ExoJAX adoption of shared Planck and coordinate definitions
  description: A local four-relation model records the actual Planck kernel conventions;
    imported closure records make the contract standalone, without claiming that the
    full LTE models are implemented.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
    entry_points:
    - src/exojax/rt/planck.py:piB
    - src/exojax/rt/planck.py:piBarr
assumptions:
- statement: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid
    is spectroscopic wavenumber in cm^-1. piB returns shape (Nnu,), piBarr returns
    (Nlayer,Nnu). Shared h is the effective kernel parameter fac_planck/(2*pi*ccgs**2)=6.62607004e-27
    erg*s; c=ccgs and k=h*c/hcperk=1.38064852e-16 erg/K. The exported constants.hcgs=6.62607015e-27
    is not used by this kernel and differs from the effective h by about 1.66e-8 relative.
    No numerical constants are changed by this adoption.
  evidence:
  - exojax.planetlib.source
domains:
- kind: scientific_applicability
  status: unknown
  description: No atmospheric LTE applicability or radiative-transfer model is assessed.
  conditions: []
  evidence:
  - exojax.planetlib.source
claims:
- id: exojax.planetlib.planck.correspondence
  revision: '1'
  statement: With the documented kernel constants and array conventions, piB and piBarr
    evaluate the four-relation Planck flux composition and its temperature and wavenumber
    derivatives.
  kind: numerical_verification
  scope: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid
    is spectroscopic wavenumber in cm^-1. piB returns shape (Nnu,), piBarr returns
    (Nlayer,Nnu). Shared h is the effective kernel parameter fac_planck/(2*pi*ccgs**2)=6.62607004e-27
    erg*s; c=ccgs and k=h*c/hcperk=1.38064852e-16 erg/K. The exported constants.hcgs=6.62607015e-27
    is not used by this kernel and differs from the effective h by about 1.66e-8 relative.
    No numerical constants are changed by this adoption. Positive finite interior
    inputs only; no complete float32/float64 stability bound, zero-frequency limit,
    population solver or atmospheric LTE assumption is established.
  equations:
  - id: planetlib.radiation.lte.frequency_coordinate
    revision: '1'
  - id: planetlib.radiation.lte.planck_frequency
    revision: '1'
  - id: planetlib.radiation.lte.intensity_conversion
    revision: '1'
  - id: planetlib.radiation.lte.hemisphere_planck
    revision: '1'
  mathematical_models:
  - id: exojax.planetlib.planck.flux
    revision: '1'
