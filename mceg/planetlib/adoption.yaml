  settings:
    planetlib_revision: a83b3fb255c7a383c6a8ef502328266f4dd16bff
    input_coordinate: spectroscopic wavenumber cm^-1
    output: hemispheric flux per cm^-1
    mapping_status: declared; no archived correspondence review
evidence:
- id: exojax.planetlib.source
  kind: implementation
  summary: Pinned provider kernel and constants with explicit effective-constant and axis conventions.
  sources:
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/rt/planck.py
  - https://github.com/HajimeKawahara/exojax/blob/38cb2e44f153ad6d729e3253e235702de52920cf/src/exojax/utils/constants.py
  scope: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid is spectroscopic wavenumber
    in cm^-1. piB returns shape (Nnu,), piBarr returns (Nlayer,Nnu). Shared h is the effective kernel parameter
    fac_planck/(2*pi*ccgs**2)=6.62607004e-27 erg*s; c=ccgs and k=h*c/hcperk=1.38064852e-16 erg/K. The exported constants.hcgs=6.62607015e-27
    is not used by this kernel and differs from the effective h by about 1.66e-8 relative. No numerical constants
    are changed by this adoption.
  subject: exojax.planetlib.source
  context: exojax.planetlib.mapping
- id: exojax.planetlib.selection
  kind: implementation
  summary: Immutable selection of Planetlib definitions and their provenance, without upstream judgments.
  sources:
  - https://github.com/HajimeKawahara/planetlib/tree/a83b3fb255c7a383c6a8ef502328266f4dd16bff
  - mceg/planetlib/imports.lock.json
  artifacts:
  - source: mceg/planetlib/imports.lock.json
    sha256: ff550a7016c4d8514952f24c9d2bbc1d85003124f6530a17747a426fea8f5156
  scope: Only the four selected relations are composed into exojax.planetlib.planck.flux. The two complete upstream
    models remain unchanged as imported dependency closures; no Subject, Context, Claim, Assessment or binding is
    imported.
mathematical_models:
- id: exojax.planetlib.planck.flux
  revision: '1'
  description: Planck hemispheric flux per spectroscopic wavenumber from four shared Planetlib relations.
  scope: Positive temperature and wavenumber in a static local frame; blackbody intensity integrated over an isotropic
    hemisphere. ExoJAX piB and piBarr return flux per inverse centimetre, not specific intensity per Hz or per steradian.
    No population closure, line strength, line profile or extinction model is selected.
  quantities:
    Bf:
      quantity:
        id: planetlib.radiation.lte.quantity.Bf
        revision: '1'
      role: derived
    T:
      quantity:
        id: planetlib.radiation.lte.quantity.T
        revision: '1'
      role: input
    c:
      quantity:
        id: planetlib.radiation.lte.quantity.c
        revision: '1'
      role: parameter
    frequency:
      quantity:
        id: planetlib.radiation.lte.quantity.frequency
        revision: '1'
      role: derived
    h:
      quantity:
        id: planetlib.radiation.lte.quantity.h
        revision: '1'
      role: parameter
    k:
      quantity:
        id: planetlib.radiation.lte.quantity.k
        revision: '1'
      role: parameter
    Bk:
      quantity:
        id: planetlib.radiation.lte.quantity.Bk
        revision: '1'
      role: derived
    piB:
      quantity:
        id: planetlib.radiation.lte.quantity.piB
        revision: '1'
      role: derived
    wavenumber:
      quantity:
        id: planetlib.radiation.lte.quantity.wavenumber
        revision: '1'
      role: input
  relations:
  - id: exojax.planetlib.planck.relation.frequency_coordinate
    equation: &id002
      id: planetlib.radiation.lte.frequency_coordinate
      revision: '1'
    kind: equation
    role: Coordinate transformation for ordinary frequency and spectroscopic wavenumber.
    quantities:
      c: c
      frequency: frequency
      wavenumber: wavenumber
  - id: exojax.planetlib.planck.relation.planck_frequency
    equation: &id003
      id: planetlib.radiation.lte.planck_frequency
      revision: '1'
    kind: equation
    role: Planck specific intensity per ordinary frequency and steradian.
    quantities:
      Bf: Bf
      T: T
      c: c
      frequency: frequency
      h: h
      k: k
  - id: exojax.planetlib.planck.relation.intensity_conversion
    equation: &id004
      id: planetlib.radiation.lte.intensity_conversion
      revision: '1'
    kind: equation
    role: Planck intensity transformed to the wavenumber coordinate.
    quantities:
      Bf: Bf
      Bk: Bk
      c: c
  - id: exojax.planetlib.planck.relation.hemisphere_planck
    equation: &id005
      id: planetlib.radiation.lte.hemisphere_planck
      revision: '1'
    kind: equation
    role: Hemispheric flux for isotropic blackbody intensity.
    quantities:
      Bk: Bk
      piB: piB
claims:
- id: exojax.planetlib.planck.correspondence
  revision: '1'
  kind: numerical_verification
  statement: With the documented kernel constants and array conventions, piB and piBarr evaluate the four-relation
    Planck flux composition and its temperature and wavenumber derivatives.
  scope: At each grid point, T (or Tarr along the layer axis) is Kelvin and nu_grid is spectroscopic wavenumber
    in cm^-1. piB returns shape (Nnu,), piBarr returns (Nlayer,Nnu). Shared h is the effective kernel parameter
    fac_planck/(2*pi*ccgs**2)=6.62607004e-27 erg*s; c=ccgs and k=h*c/hcperk=1.38064852e-16 erg/K. The exported constants.hcgs=6.62607015e-27
    is not used by this kernel and differs from the effective h by about 1.66e-8 relative. No numerical constants
    are changed by this adoption. Positive finite interior inputs only; no complete float32/float64 stability bound,
    zero-frequency limit, population solver or atmospheric LTE assumption is established.
  equations:
  - *id002
  - *id003
  - *id004
  - *id005
  mathematical_models:
  - id: exojax.planetlib.planck.flux
    revision: '1'
bindings:
- id: exojax.planetlib.piB.flux
  equation:
    id: planetlib.radiation.lte.hemisphere_planck
    revision: '1'
  subject: exojax.planetlib.source
  source: src/exojax/rt/planck.py
  symbol: piB
  result: piB
  note: Result quantity/location declaration at each spectral grid point. Bk is supplied internally by the other
    three relations of exojax.planetlib.planck.flux, not by a Bk argument. The full temperature/wavenumber inputs,
    effective constants and array axes are specified in the Context and checked separately; native AST checks do
    not infer composition or array semantics.
- id: exojax.planetlib.piBarr.flux
  equation:
