- id: exojax.spectral_observation.initial_samples.cpu
  scope: An even-length impulse spectrum and odd-length Gaussian/rotation kernels, zero-rotation identity,
    selected quadratic-rotation values/interior derivative, positive-RV km/s sampling and its derivative, plus
