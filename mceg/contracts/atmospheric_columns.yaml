model:
  id: exojax.atmospheric_columns
  name: Atmospheric absorber columns and hydrostatic geometry
  description: Provider-owned conventions and bounded review scope for shared Planetlib
    definitions.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
    entry_points:
    - src/exojax/rt/layeropacity.py:layer_optical_depth_from_cross_section
    - src/exojax/rt/layeropacity.py:layer_optical_depth_from_log_cia
    - src/exojax/atm/atmprof.py:hydrostatic_radius_profile
    - src/exojax/atm/atmprof.py:hydrostatic_radius_profile_ideal_gas
    - src/exojax/rt/layeropacity.py:layer_optical_depth
    - src/exojax/rt/layeropacity.py:layer_optical_depth
assumptions:
- statement: Layer quantities use cgs units, except pressure APIs take bar and molecular-mass
    inputs take amu. Cross-section arrays are (Nlayer,Nwavenumber); number columns
    are cm^-2. Pressure-column evaluation uses effective mass unit bar_cgs/opacity_factor;
    the hydrostatic ideal-gas path uses exported m_u, so constant sets must not be
    silently equated. MMR q uses absorber mass, VMR x_abs uses mean molecular mass;
    q=x_abs*m_abs/m_mean. CIA coefficient is cm^5 and tau=k*n1*n2*dz, including identical
    partners without a factor one-half. Hydrostatic boundaries run top to bottom,
    dP>0, with lower radius prescribed and g proportional to r^-2; constant-density
    and ideal-gas layer closures are distinct.
  evidence:
  - exojax.atmospheric_columns.source
