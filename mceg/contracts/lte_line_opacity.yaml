contexts:
- id: exojax.lte_line_opacity.scope
  scope: Isolated LTE lines in spectroscopic wavenumber cm^-1. Strength S has units
    cm per molecule; cross section has units cm^2 per molecule. Q_ratio=Q(T)/Q(T_ref),
    lower energy is cm^-1, Gaussian sigma_D is a standard deviation and gamma_L is
    a Lorentz HWHM. LPF explicitly sums line strengths times normalized Voigt profiles.
    The JAX strength kernel takes log(S_ref). The rounded Doppler coefficient 3.0415595e-7
    multiplies w0*sqrt(T/M), with M in amu; finite rounding tolerance is retained.
    Broadening inputs, partition functions, database accuracy, line-wing truncation
    and pressure-shift prescriptions are supplied choices.
  quantities: {}
  settings:
    planetlib_revision: 20c0a3936cc6c1ad790945b936c1ef3ad74af31e
    precision: Selected CPU float64 comparisons; no global float32/float64 error bound
    numerical_choices: MODIT and PreMODIT use the same target line physics but distinct
      grid, interpolation, truncation and temperature-expansion approximations. Their
      numerical domains and errors require separate evidence; no universal algorithm
      equivalence is claimed.
- id: exojax.lte_line_opacity.modit.scope
  scope: MODIT approximates the LTE line model with its own discretization. MODIT
    and PreMODIT use the same target line physics but distinct grid, interpolation,
    truncation and temperature-expansion approximations. Their numerical domains and
    errors require separate evidence; no universal algorithm equivalence is claimed.
  quantities: {}
  settings:
    algorithm: modit
    validation_status: No algorithm-wide error or derivative claim is supported.
- id: exojax.lte_line_opacity.premodit.scope
  scope: PREMODIT approximates the LTE line model with its own discretization. MODIT
    and PreMODIT use the same target line physics but distinct grid, interpolation,
    truncation and temperature-expansion approximations. Their numerical domains and
    errors require separate evidence; no universal algorithm equivalence is claimed.
  quantities: {}
  settings:
    algorithm: premodit
    validation_status: No algorithm-wide error or derivative claim is supported.
- id: exojax.lte_line_opacity.initial_samples.cpu
  scope: Three selected LTE line strengths and partial temperature derivatives with
    Q_ratio held fixed, the documented Doppler rounding tolerance, finite-line LPF
    sums versus native-profile quadrature, and the existing SciPy Faddeeva comparisons
    in two precisions. No MODIT/PreMODIT error domain or partition-function derivative
    is assessed. Exact points, arrays, boundary choices and tolerances are those in
    the hashed tests and named JUnit cases. This is a finite execution result, not
    a proof, primary-source correspondence review or empirical applicability judgment.
  quantities: {}
  settings:
    backend: cpu
    precision: Companion comparisons use the isolated_test_environment fixture and
      CPU float64. Existing Planck tests explicitly use float32; existing LPF tests
      select both float32 and float64. No GPU or global precision-domain claim.
    selected_passed_cases: 9
