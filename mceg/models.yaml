models:
- id: exojax.spectral.planck
  description: Blackbody flux per wavenumber with the actual kernel constants. The linked four-relation composition
    excludes a population closure.
  review_pending: true
  bindings:
  - path: src/exojax/rt/planck.py
    symbol: piB
  - path: src/exojax/rt/planck.py
    symbol: piBarr
  contracts:
  - path: mceg/contracts/planck.yaml
    model_id: exojax.planetlib.adoption
- id: exojax.spectral.constants
  description: Mixed historical cgs and astronomical constant conventions. Initial inventory identifies the module,
    not a uniform reference-standard adoption.
  review_pending: true
  bindings:
  - path: src/exojax/utils/constants.py
  contracts: []
- id: exojax.molecular.lte_line_strength
  description: LTE reference-temperature line strengths and partition-function ratios. Caller-selected line lists
    and isotope conventions require their own evidence.
  review_pending: true
  bindings:
  - path: src/exojax/database/core/line_strength.py
    symbol: line_strength
  - path: src/exojax/database/core/line_strength.py
    symbol: line_strength_numpy
  contracts:
  - path: mceg/contracts/lte_line_opacity.yaml
    model_id: exojax.lte_line_opacity
- id: exojax.molecular.doppler_natural_width
  description: Doppler standard deviation and natural Lorentz half-width; the shared contract does not validate
    a broadening dataset.
  review_pending: true
  bindings:
  - path: src/exojax/database/core/broadening.py
    symbol: doppler_sigma
  - path: src/exojax/database/core/broadening.py
    symbol: gamma_natural
  contracts:
  - path: mceg/contracts/lte_line_opacity.yaml
    model_id: exojax.lte_line_opacity
- id: exojax.molecular.exomol_pressure_width
  description: ExoMol power-law pressure width and supplied broadener parameters; distinct from HITRAN air/self
    mixing.
  review_pending: true
  bindings:
  - path: src/exojax/database/core/broadening.py
    symbol: gamma_exomol
  contracts: []
- id: exojax.molecular.hitran_pressure_width
  description: HITRAN air/self pressure broadening with its reference pressure and temperature conventions.
  review_pending: true
  bindings:
  - path: src/exojax/database/core/broadening.py
    symbol: gamma_hitran
  contracts: []
- id: exojax.opacity.lpf
  description: Direct Voigt line summation. The family contract records the common line law; custom JVPs and implementation
    error bounds remain separate review targets.
  review_pending: true
  bindings:
  - path: src/exojax/opacity/lpf/lpf.py
    symbol: voigtone
  - path: src/exojax/opacity/lpf/lpf.py
    symbol: xsvector
  contracts:
  - path: mceg/contracts/lte_line_opacity.yaml
    model_id: exojax.lte_line_opacity
- id: exojax.opacity.modit
  description: MODIT discretization of the line law on log-wavenumber/broadening grids; FFT support and open/closed-grid
    variants remain numerical choices.
  review_pending: true
  bindings:
  - path: src/exojax/opacity/modit/api.py
    symbol: OpaModit
  - path: src/exojax/opacity/modit/modit.py
  contracts:
  - path: mceg/contracts/lte_line_opacity.yaml
    model_id: exojax.lte_line_opacity
- id: exojax.opacity.premodit.order0
  description: PreMODIT line law with retained temperature expansion order 0. Reference temperatures, energy grids
    and truncation errors require a scoped numerical review.
  review_pending: true
  bindings:
  - path: src/exojax/opacity/premodit/api.py
    symbol: OpaPremodit
    settings: &id001
      diffmode: 0
  - path: src/exojax/opacity/premodit/premodit.py
    settings: *id001
