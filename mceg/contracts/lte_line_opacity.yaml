  symbols:
    N_lines:
      latex: N_{lines}
      description: Number of selected transitions.
      unit: '1'
    S_line:
      latex: S_{line}
      description: Per-absorber integrated strengths for the selected transitions.
      unit: cm
    i:
      latex: i
      description: Line index in the finite selected line list.
      unit: '1'
    phi_line:
      latex: \phi_{line}
      description: Per-line normalized profiles evaluated at line index and wavenumber
        offset.
      unit: cm
    sigma_total:
      latex: \sigma_{total}
      description: Absorption cross section per common absorber from the finite line
