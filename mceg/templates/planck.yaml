mathematical_models:
- id: exojax.planetlib.planck.flux
  revision: '1'
  description: Planck hemispheric flux per spectroscopic wavenumber from four shared Planetlib relations.
  scope: Positive temperature and wavenumber in a static local frame; blackbody intensity integrated over an
    isotropic hemisphere. ExoJAX piB and piBarr return flux per inverse centimetre, not specific intensity
    per Hz or per steradian. No population closure, line strength, line profile or extinction model is selected.
  quantities:
    Bf:
      quantity:
        id: planetlib.radiation.lte.quantity.Bf
        revision: '1'
      role: derived
    T:
      quantity:
        id: planetlib.radiation.lte.quantity.T
        revision: '1'
      role: input
    c:
      quantity:
        id: planetlib.radiation.lte.quantity.c
        revision: '1'
      role: parameter
    frequency:
      quantity:
        id: planetlib.radiation.lte.quantity.frequency
        revision: '1'
      role: derived
    h:
      quantity:
        id: planetlib.radiation.lte.quantity.h
        revision: '1'
      role: parameter
    k:
      quantity:
        id: planetlib.radiation.lte.quantity.k
        revision: '1'
      role: parameter
    Bk:
      quantity:
        id: planetlib.radiation.lte.quantity.Bk
        revision: '1'
      role: derived
    piB:
      quantity:
        id: planetlib.radiation.lte.quantity.piB
        revision: '1'
      role: derived
    wavenumber:
      quantity:
        id: planetlib.radiation.lte.quantity.wavenumber
        revision: '1'
      role: input
  relations:
  - id: exojax.planetlib.planck.relation.frequency_coordinate
    equation: &id002
      id: planetlib.radiation.lte.frequency_coordinate
      revision: '1'
    kind: equation
    role: Coordinate transformation for ordinary frequency and spectroscopic wavenumber.
    quantities:
      c: c
      frequency: frequency
      wavenumber: wavenumber
  - id: exojax.planetlib.planck.relation.planck_frequency
    equation: &id003
      id: planetlib.radiation.lte.planck_frequency
      revision: '1'
    kind: equation
    role: Planck specific intensity per ordinary frequency and steradian.
    quantities:
      Bf: Bf
      T: T
      c: c
      frequency: frequency
      h: h
      k: k
  - id: exojax.planetlib.planck.relation.intensity_conversion
    equation: &id004
      id: planetlib.radiation.lte.intensity_conversion
      revision: '1'
    kind: equation
    role: Planck intensity transformed to the wavenumber coordinate.
    quantities:
      Bf: Bf
      Bk: Bk
      c: c
  - id: exojax.planetlib.planck.relation.hemisphere_planck
    equation: &id005
      id: planetlib.radiation.lte.hemisphere_planck
      revision: '1'
    kind: equation
    role: Hemispheric flux for isotropic blackbody intensity.
    quantities:
      Bk: Bk
      piB: piB
