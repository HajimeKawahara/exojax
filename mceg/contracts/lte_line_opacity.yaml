schema_version: '0.6'
model:
  id: exojax.lte_line_opacity
  name: LTE line strength and profile opacity
  description: Provider-owned conventions and bounded review scope for shared Planetlib
    definitions.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax
    revision: 38cb2e44f153ad6d729e3253e235702de52920cf
    entry_points:
    - src/exojax/database/core/line_strength.py:line_strength_numpy
    - src/exojax/database/core/line_strength.py:line_strength
    - src/exojax/database/core/broadening.py:doppler_sigma
    - src/exojax/opacity/lpf/lpf.py:voigtone
    - src/exojax/opacity/lpf/lpf.py:xsvector
assumptions:
- statement: Isolated LTE lines in spectroscopic wavenumber cm^-1. Strength S has
    units cm per molecule; cross section has units cm^2 per molecule. Q_ratio=Q(T)/Q(T_ref),
    lower energy is cm^-1, Gaussian sigma_D is a standard deviation and gamma_L is
    a Lorentz HWHM. LPF explicitly sums line strengths times normalized Voigt profiles.
    The JAX strength kernel takes log(S_ref). The rounded Doppler coefficient 3.0415595e-7
    multiplies w0*sqrt(T/M), with M in amu; finite rounding tolerance is retained.
    Broadening inputs, partition functions, database accuracy, line-wing truncation
    and pressure-shift prescriptions are supplied choices.
  evidence:
  - exojax.lte_line_opacity.source
domains:
- kind: scientific_applicability
  status: unknown
  description: Application to a particular atmosphere or observation needs independent
    validation.
  conditions: []
  evidence:
  - exojax.lte_line_opacity.source
