    relative. No numerical constants are changed by this adoption.
  settings:
    planetlib_revision: a83b3fb255c7a383c6a8ef502328266f4dd16bff
    input_coordinate: spectroscopic wavenumber cm^-1
    output: hemispheric flux per cm^-1
    mapping_status: declared; no archived correspondence review
- id: exojax.planetlib.planck.initial_samples.cpu
  scope: Three float64 temperatures with near-Rayleigh-Jeans/intermediate/Wien wavenumbers, selected temperature/wavenumber
    derivatives, layer axes, and the two existing float32 high-exponent value/gradient cases. Effective fac_planck/hcperk
    constants are retained. Exact points, arrays, boundary choices and tolerances are those in the hashed tests
    and named JUnit cases. This is a finite execution result, not a proof, primary-source correspondence review
    or empirical applicability judgment.
  settings:
