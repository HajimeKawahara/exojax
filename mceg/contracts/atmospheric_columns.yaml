- id: planetlib.atmosphere.columns.geometric_column
  revision: '1'
  description: Uniform-density geometric absorber column.
  scope: Local cgs absorber-column relations with positive gravity and particle masses.
    Pressure differences are in dyn cm^-2, not bar. Pressure-column formulas assume
    constant composition and gravity over the pressure interval. The separate differential
    hydrostatic relation allows inverse-square gravity; integrating a finite atmosphere
    still requires thermal/composition profiles and a boundary.
  symbols:
    N_abs:
      latex: N_{abs}
      description: Number of absorbing particles per unit area through the layer.
      unit: cm^-2
    dz:
      latex: dz
      description: Positive geometric path length for the local column.
      unit: cm
    n_abs:
      latex: n_{abs}
      description: Uniform absorber number density on the supplied geometric path.
      unit: cm^-3
  assumptions:
  - Cross section is per absorbing particle; mass mixing ratio is absorber mass divided
    by total gas mass, whereas volume mixing ratio is absorber number divided by total
    gas particle number.
  - CIA coefficient k_cia is defined by alpha=k_cia*n1*n2. Its supplied convention
    already accounts for identical partners; no additional factor 1/2 is applied.
  - The pressure-column approximation and the differential inverse-square hydrostatic
    relation are distinct relations, not a claim that finite layers have exactly constant
    gravity. The scalar m_mean is the selected layer value of the separately supplied
    radial mean-mass field m_mean_r.
